<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 580" width="100%" height="100%">
  <rect width="650" height="580" fill="#ffffff"/>
  
  <defs>
    <style>
      .label { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; fill: #2c2c2c; }
      .bold { font-weight: 700; }
      .italic { font-style: italic; }
      .stroke-dark { stroke: #2c2c2c; fill: none; }
      .fill-gray { fill: #6e6e6e; }
      .fill-dark { fill: #2c2c2c; }
    </style>
    <!-- Person silhouette -->
    <g id="person-white">
      <circle cx="0" cy="-7" r="2.2" fill="#ffffff"/>
      <path d="M-2.5,-3.5 C-2.5,-4.5 2.5,-4.5 2.5,-3.5 L2.5,1 L1.5,1 L1.5,6 L-1.5,6 L-1.5,1 L-2.5,1 Z" fill="#ffffff"/>
    </g>
    <g id="person-dark">
      <circle cx="0" cy="-12" r="4.5" fill="#2c2c2c"/>
      <path d="M-5.5,-5 C-5.5,-7 5.5,-7 5.5,-5 L5.5,4 L3.5,4 L3.5,15 L-3.5,15 L-3.5,4 L-5.5,4 Z" fill="#2c2c2c"/>
    </g>
    <!-- Destination Map Pin Icon -->
    <g id="icon-destination">
      <path d="M-18,12 L-12,-2 L12,-2 L18,12 Z" fill="none" stroke="#2c2c2c" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M0,6 C0,6 -10,-6 -10,-13 C-10,-18.5 -5.5,-23 0,-23 C5.5,-23 10,-18.5 10,-13 C10,-6 0,6 0,6 Z" fill="#ffffff" stroke="#2c2c2c" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="0" cy="-13" r="4" fill="none" stroke="#2c2c2c" stroke-width="1.6"/>
    </g>
    <!-- Folded Map Icon -->
    <g id="icon-map">
      <polygon points="-18,-15 -6,-19 -6,15 -18,19" fill="none" stroke="#2c2c2c" stroke-width="1.5" stroke-linejoin="round"/>
      <polygon points="-6,-19 6,-15 6,19 -6,15" fill="none" stroke="#2c2c2c" stroke-width="1.5" stroke-linejoin="round"/>
      <polygon points="6,-15 18,-19 18,15 6,19" fill="none" stroke="#2c2c2c" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="-12" cy="-9" r="3" fill="none" stroke="#2c2c2c" stroke-width="1.3"/>
      <path d="M-12,-4 C-8,4 -2,-6 0,2 C2,8 8,4 12,-4" fill="none" stroke="#2c2c2c" stroke-width="1.3" stroke-dasharray="2,2"/>
      <path d="M12,-6 C12,-6 9,-10 9,-12 C9,-13.7 10.3,-15 12,-15 C13.7,-15 15,-13.7 15,-12 C15,-10 12,-6 12,-6 Z" fill="none" stroke="#2c2c2c" stroke-width="1.2"/>
      <path d="M-2,7 L2,11 M2,7 L-2,11" stroke="#2c2c2c" stroke-width="1.3"/>
    </g>
    <!-- Vehicle Car Icon -->
    <g id="icon-vehicle">
      <path d="M-24,6 L-24,-2 C-24,-6 -18,-12 -12,-12 L4,-12 C10,-12 14,-5 18,-4 L23,-2 C25,-1 26,1 26,4 L26,6 Z" fill="none" stroke="#2c2c2c" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="-14" cy="6" r="5" fill="#ffffff" stroke="#2c2c2c" stroke-width="1.6"/>
      <circle cx="15" cy="6" r="5" fill="#ffffff" stroke="#2c2c2c" stroke-width="1.6"/>
    </g>
    <!-- Tools Compass Icon -->
    <g id="icon-tools">
      <circle cx="0" cy="0" r="17" fill="none" stroke="#2c2c2c" stroke-width="1.6"/>
      <line x1="0" y1="-17" x2="0" y2="-13" stroke="#2c2c2c" stroke-width="1.4"/>
      <line x1="0" y1="13" x2="0" y2="17" stroke="#2c2c2c" stroke-width="1.4"/>
      <line x1="-17" y1="0" x2="-13" y2="0" stroke="#2c2c2c" stroke-width="1.4"/>
      <line x1="13" y1="0" x2="17" y2="0" stroke="#2c2c2c" stroke-width="1.4"/>
      <polygon points="9,-9 3,3 -9,9 -3,-3" fill="none" stroke="#2c2c2c" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="0" cy="0" r="2" fill="#2c2c2c"/>
    </g>
  </defs>


  <!-- Top Diagram: Landscape Horizon View -->
  <g transform="translate(140, 60)">
    <rect x="0" y="0" width="160" height="140" fill="none" stroke="#2c2c2c" stroke-width="3"/>
    <!-- Mountains (Background) -->
    <polygon points="0,85 45,15 85,65 110,30 160,85" fill="#4a4a4a"/>
    <!-- Midground hills & winding road -->
    <rect x="0" y="85" width="160" height="55" fill="#8c8c8c"/>
    <path d="M60,140 C65,115 110,105 90,85 L102,85 C128,105 115,120 135,140 Z" fill="#ffffff" stroke="#2c2c2c" stroke-width="1.5"/>
    <!-- Foreground signpost -->
    <rect x="38" y="106" width="18" height="18" fill="#ffffff" stroke="#2c2c2c" stroke-width="1.5"/>
    <circle cx="47" cy="115" r="4" fill="#2c2c2c"/>
    <line x1="47" y1="124" x2="47" y2="140" stroke="#2c2c2c" stroke-width="3"/>

    <!-- Callout Dots & Dashed Lines -->
    <!-- Beyond-the-Horizon (Sky) -->
    <circle cx="130" cy="24" r="3.5" fill="#2c2c2c"/>
    <line x1="130" y1="24" x2="195" y2="24" stroke="#2c2c2c" stroke-width="1.8" stroke-dasharray="3,3"/>
    <text x="205" y="29" class="label bold" font-size="16">Beyond-the-Horizon</text>

    <!-- Background (Mountain) -->
    <circle cx="40" cy="58" r="3.5" fill="#ffffff"/>
    <line x1="40" y1="58" x2="195" y2="58" stroke="#2c2c2c" stroke-width="1.8" stroke-dasharray="3,3"/>
    <text x="205" y="63" class="label bold" font-size="16">Background</text>

    <!-- Midground (Road) -->
    <circle cx="102" cy="92" r="3.5" fill="#2c2c2c"/>
    <line x1="102" y1="92" x2="195" y2="92" stroke="#2c2c2c" stroke-width="1.8" stroke-dasharray="3,3"/>
    <text x="205" y="97" class="label bold" font-size="16">Midground</text>

    <!-- Foreground (Signpost) -->
    <circle cx="47" cy="115" r="3.5" fill="#2c2c2c"/>
    <line x1="47" y1="115" x2="195" y2="124" stroke="#2c2c2c" stroke-width="1.8" stroke-dasharray="3,3"/>
    <text x="205" y="129" class="label bold" font-size="16">Foreground</text>
  </g>

  <!-- Bottom Diagram: Perspective Frame View -->
  <g transform="translate(140, 290)">
    <rect x="0" y="0" width="180" height="170" fill="none" stroke="#2c2c2c" stroke-width="2.5"/>
    <!-- Inner perspective box -->
    <rect x="38" y="34" width="104" height="102" fill="none" stroke="#2c2c2c" stroke-width="2"/>
    <!-- Corner perspective lines -->
    <line x1="0" y1="0" x2="38" y2="34" stroke="#2c2c2c" stroke-width="2"/>
    <line x1="180" y1="0" x2="142" y2="34" stroke="#2c2c2c" stroke-width="2"/>
    <line x1="0" y1="170" x2="38" y2="136" stroke="#2c2c2c" stroke-width="2"/>
    <line x1="180" y1="170" x2="142" y2="136" stroke="#2c2c2c" stroke-width="2"/>

    <!-- 4 Tiers inside inner box -->
    <line x1="38" y1="60" x2="142" y2="60" stroke="#2c2c2c" stroke-width="2"/>
    <line x1="38" y1="85" x2="142" y2="85" stroke="#2c2c2c" stroke-width="2"/>
    <line x1="38" y1="110" x2="142" y2="110" stroke="#2c2c2c" stroke-width="2"/>

    <!-- Sub-columns in row 2 (Background) and row 4 (Foreground) -->
    <line x1="64" y1="60" x2="64" y2="85" stroke="#2c2c2c" stroke-width="1.8"/>
    <line x1="90" y1="60" x2="90" y2="85" stroke="#2c2c2c" stroke-width="1.8"/>
    <line x1="116" y1="60" x2="116" y2="85" stroke="#2c2c2c" stroke-width="1.8"/>

    <line x1="64" y1="110" x2="64" y2="136" stroke="#2c2c2c" stroke-width="1.8"/>
    <line x1="90" y1="110" x2="90" y2="136" stroke="#2c2c2c" stroke-width="1.8"/>
    <line x1="116" y1="110" x2="116" y2="136" stroke="#2c2c2c" stroke-width="1.8"/>

    <!-- Callout Dots & Labels -->
    <circle cx="130" cy="47" r="3" fill="#2c2c2c"/>
    <line x1="130" y1="47" x2="200" y2="12" stroke="#2c2c2c" stroke-width="1.2" stroke-dasharray="2,2"/>
    <text x="208" y="10" class="label bold" font-size="13">Beyond-the-Horizon</text>
    <text x="208" y="26" class="label bold" font-size="13">Vision (5–20 years)</text>

    <circle cx="130" cy="72" r="3" fill="#2c2c2c"/>
    <line x1="130" y1="72" x2="200" y2="55" stroke="#2c2c2c" stroke-width="1.2" stroke-dasharray="2,2"/>
    <text x="208" y="53" class="label bold" font-size="13">Background Vision</text>
    <text x="208" y="69" class="label bold" font-size="13">(3 years)</text>

    <circle cx="130" cy="97" r="3" fill="#2c2c2c"/>
    <line x1="130" y1="97" x2="200" y2="98" stroke="#2c2c2c" stroke-width="1.2" stroke-dasharray="2,2"/>
    <text x="208" y="96" class="label bold" font-size="13">Midground Vision</text>
    <text x="208" y="112" class="label bold" font-size="13">(1 year)</text>

    <circle cx="130" cy="123" r="3" fill="#2c2c2c"/>
    <line x1="130" y1="123" x2="200" y2="142" stroke="#2c2c2c" stroke-width="1.2" stroke-dasharray="2,2"/>
    <text x="208" y="140" class="label bold" font-size="13">Foreground Vision</text>
    <text x="208" y="156" class="label bold" font-size="13">(90 days)</text>
  </g>
</svg>