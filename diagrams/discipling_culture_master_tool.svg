      <line x1="0" y1="-17" x2="0" y2="-13" stroke="#2c2c2c" stroke-width="1.4"/>
      <line x1="0" y1="13" x2="0" y2="17" stroke="#2c2c2c" stroke-width="1.4"/>
      <line x1="-17" y1="0" x2="-13" y2="0" stroke="#2c2c2c" stroke-width="1.4"/>
      <line x1="13" y1="0" x2="17" y2="0" stroke="#2c2c2c" stroke-width="1.4"/>
