<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 250" width="100%" height="100%">
  <rect width="750" height="250" fill="#ffffff"/>
  
  <defs>
    <style>
      .label { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; fill: #2c2c2c; }
      .bold { font-weight: 700; }
      .italic { font-style: italic; }
      .stroke-dark { stroke: #2c2c2c; fill: none; }
      .fill-gray { fill: #6e6e6e; }
      .fill-dark { fill: #2c2c2c; }
    </style>
    <!-- Person silhouette -->
    <g id="person-white">
      <circle cx="0" cy="-7" r="2.2" fill="#ffffff"/>
      <path d="M-2.5,-3.5 C-2.5,-4.5 2.5,-4.5 2.5,-3.5 L2.5,1 L1.5,1 L1.5,6 L-1.5,6 L-1.5,1 L-2.5,1 Z" fill="#ffffff"/>
    </g>
    <g id="person-dark">
      <circle cx="0" cy="-12" r="4.5" fill="#2c2c2c"/>
      <path d="M-5.5,-5 C-5.5,-7 5.5,-7 5.5,-5 L5.5,4 L3.5,4 L3.5,15 L-3.5,15 L-3.5,4 L-5.5,4 Z" fill="#2c2c2c"/>
    </g>
    <!-- Destination Map Pin Icon -->
    <g id="icon-destination">
      <path d="M-18,12 L-12,-2 L12,-2 L18,12 Z" fill="none" stroke="#2c2c2c" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M0,6 C0,6 -10,-6 -10,-13 C-10,-18.5 -5.5,-23 0,-23 C5.5,-23 10,-18.5 10,-13 C10,-6 0,6 0,6 Z" fill="#ffffff" stroke="#2c2c2c" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="0" cy="-13" r="4" fill="none" stroke="#2c2c2c" stroke-width="1.6"/>
    </g>
    <!-- Folded Map Icon -->
    <g id="icon-map">
      <polygon points="-18,-15 -6,-19 -6,15 -18,19" fill="none" stroke="#2c2c2c" stroke-width="1.5" stroke-linejoin="round"/>
      <polygon points="-6,-19 6,-15 6,19 -6,15" fill="none" stroke="#2c2c2c" stroke-width="1.5" stroke-linejoin="round"/>
      <polygon points="6,-15 18,-19 18,15 6,19" fill="none" stroke="#2c2c2c" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="-12" cy="-9" r="3" fill="none" stroke="#2c2c2c" stroke-width="1.3"/>
      <path d="M-12,-4 C-8,4 -2,-6 0,2 C2,8 8,4 12,-4" fill="none" stroke="#2c2c2c" stroke-width="1.3" stroke-dasharray="2,2"/>
      <path d="M12,-6 C12,-6 9,-10 9,-12 C9,-13.7 10.3,-15 12,-15 C13.7,-15 15,-13.7 15,-12 C15,-10 12,-6 12,-6 Z" fill="none" stroke="#2c2c2c" stroke-width="1.2"/>
      <path d="M-2,7 L2,11 M2,7 L-2,11" stroke="#2c2c2c" stroke-width="1.3"/>
    </g>
    <!-- Vehicle Car Icon -->
    <g id="icon-vehicle">
      <path d="M-24,6 L-24,-2 C-24,-6 -18,-12 -12,-12 L4,-12 C10,-12 14,-5 18,-4 L23,-2 C25,-1 26,1 26,4 L26,6 Z" fill="none" stroke="#2c2c2c" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="-14" cy="6" r="5" fill="#ffffff" stroke="#2c2c2c" stroke-width="1.6"/>
      <circle cx="15" cy="6" r="5" fill="#ffffff" stroke="#2c2c2c" stroke-width="1.6"/>
    </g>
    <!-- Tools Compass Icon -->
    <g id="icon-tools">
      <circle cx="0" cy="0" r="17" fill="none" stroke="#2c2c2c" stroke-width="1.6"/>
      <line x1="0" y1="-17" x2="0" y2="-13" stroke="#2c2c2c" stroke-width="1.4"/>
      <line x1="0" y1="13" x2="0" y2="17" stroke="#2c2c2c" stroke-width="1.4"/>
      <line x1="-17" y1="0" x2="-13" y2="0" stroke="#2c2c2c" stroke-width="1.4"/>
      <line x1="13" y1="0" x2="17" y2="0" stroke="#2c2c2c" stroke-width="1.4"/>
      <polygon points="9,-9 3,3 -9,9 -3,-3" fill="none" stroke="#2c2c2c" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="0" cy="0" r="2" fill="#2c2c2c"/>
    </g>
  </defs>


  <!-- #1. CELEBRATE -->
  <g transform="translate(135, 95)">
    <text x="0" y="-55" class="label bold" font-size="14" text-anchor="middle">#1. CELEBRATE</text>
    <circle cx="0" cy="0" r="34" fill="#6b6257"/>
    <!-- Party popper icon -->
    <polygon points="-16,16 -4,-10 10,4" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="2" y1="-8" x2="12" y2="-18" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="-2" x2="18" y2="-6" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="-4" y1="-14" x2="-2" y2="-22" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="6" cy="-18" r="1.8" fill="#ffffff"/>
    <circle cx="16" cy="-13" r="1.8" fill="#ffffff"/>
    <text x="0" y="60" class="label" font-size="12" text-anchor="middle">What was your next</text>
    <text x="0" y="75" class="label" font-size="12" text-anchor="middle">step from last time and</text>
    <text x="0" y="90" class="label" font-size="12" text-anchor="middle">what happened?</text>
  </g>

  <!-- #2. DISCIPLESHIP FOCUS -->
  <g transform="translate(375, 95)">
    <text x="0" y="-55" class="label bold" font-size="14" text-anchor="middle">#2. DISCIPLESHIP FOCUS</text>
    <circle cx="0" cy="0" r="34" fill="#6b6257"/>
    <!-- Magnifying glass icon -->
    <circle cx="5" cy="-5" r="10" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="-2" y1="2" x2="-15" y2="15" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="60" class="label" font-size="12" text-anchor="middle">How will your tools</text>
    <text x="0" y="75" class="label" font-size="12" text-anchor="middle">intersect and shape your</text>
    <text x="0" y="90" class="label" font-size="12" text-anchor="middle">discipleship environment?</text>
  </g>

  <!-- #3. NEXT STEP -->
  <g transform="translate(615, 95)">
    <text x="0" y="-55" class="label bold" font-size="14" text-anchor="middle">#3. NEXT STEP</text>
    <circle cx="0" cy="0" r="34" fill="#6b6257"/>
    <!-- Footprints / Shoes icon -->
    <ellipse cx="-8" cy="-6" rx="5" ry="11" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <path d="M-12,7 C-12,13 -4,13 -4,7 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="8" cy="-2" rx="5" ry="11" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <path d="M4,11 C4,17 12,17 12,11 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="60" class="label" font-size="12" text-anchor="middle">What is one thing you can</text>
    <text x="0" y="75" class="label" font-size="12" text-anchor="middle">do in the next week to</text>
    <text x="0" y="90" class="label" font-size="12" text-anchor="middle">respond and how can we</text>
    <text x="0" y="105" class="label" font-size="12" text-anchor="middle">hold you accountable?</text>
  </g>
</svg>